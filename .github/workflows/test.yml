name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q sharextract
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI help
        run: python -m sharextract --help
      - name: Offline adapter health
        run: python -m sharextract --health --compact

  service-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service extras
        run: python -m pip install -e ".[service,mcp]"
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Import service entrypoints
        run: |
          python -c "from sharextract.http_api import app; print(app.title)"
          python -c "from sharextract.mcp_server import mcp; print(mcp.name)"

  browser-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser extra
        run: python -m pip install -e ".[browser]"
      - name: Run tests with browser package available
        run: python -m unittest discover -s tests -v
      - name: Import browser helper
        run: python -c "from sharextract.browser import fetch_public_json_response, fetch_public_rendered_snapshot; print(fetch_public_json_response.__name__, fetch_public_rendered_snapshot.__name__)"


  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check --no-input "build==1.6.0"
      - name: Verify reproducible core wheel contract
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=946684800
          rm -rf dist dist-repro
          python -m build --wheel --outdir dist
          python -m build --wheel --outdir dist-repro
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          repro="$(find dist-repro -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel" -a -n "$repro"
          cmp "$wheel" "$repro"
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          python scripts/verify-release-wheel.py "$wheel" --version "$version"
