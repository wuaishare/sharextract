name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          tag = "${{ github.ref_name }}"
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          runtime = pathlib.Path("sharextract/version.py").read_text()
          skill = pathlib.Path("SKILL.md").read_text()
          if tag != f"v{version}":
              raise SystemExit(f"tag/version mismatch: {tag} != v{version}")
          if f'__version__ = "{version}"' not in runtime:
              raise SystemExit("sharextract/version.py drifted from pyproject.toml")
          if not re.search(rf'^\s*version:\s*"{re.escape(version)}"\s*$', skill, re.M):
              raise SystemExit("SKILL.md metadata version drifted from pyproject.toml")
          print(f"release identity OK: {tag}")
          PY

      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check --no-input "build==1.6.0"

      - name: Build twice and prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          # Fixed epoch makes the wheel byte-reproducible independent of commit/tag timestamps.
          export SOURCE_DATE_EPOCH=946684800
          rm -rf dist dist-repro
          python -m build --wheel --outdir dist
          python -m build --wheel --outdir dist-repro
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          repro="$(find dist-repro -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel" -a -n "$repro"
          cmp "$wheel" "$repro"
          python scripts/verify-release-wheel.py "$wheel" --version "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum *.whl > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest release wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*.whl"

      - name: Verify GitHub provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"

      - name: Create immutable-by-policy release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite published assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME"             dist/*.whl             dist/SHA256SUMS             --verify-tag             --title "$GITHUB_REF_NAME"             --generate-notes
